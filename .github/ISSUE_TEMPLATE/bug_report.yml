name: Bug report
description: Create a report to help us improve
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: Verify steps
      description: Please verify that you've followed these steps
      options:
        - label: Is this something you can **debug and fix**? Send a pull request! Bug fixes and documentation fixes are welcome.
          required: true

        - label: I have read the [Wiki](https://metatube-community.github.io/wiki/), especially the [FAQ](https://metatube-community.github.io/faq/) page.
          required: true

        - label: I have searched on the [issue tracker](https://github.com/metatube-community/jellyfin-plugin-metatube/issues) for a related issue.
          required: true

  - type: dropdown
    id: media-server
    attributes:
      label: Media Server
      options:
        - Jellyfin
        - Emby
    validations:
      required: true

  - type: input
    id: media-server-version
    attributes:
      label: Media Server Version
      placeholder: e.g. 10.11.0
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: MetaTube Plugin Version
      placeholder: e.g. v2025.1102.2200.0
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: MetaTube Server Version
      placeholder: e.g. v1.4.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: What OS are you seeing the problem on?
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - Docker
        - NAS (Synology, Unraid, etc.)
        - Other

  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: server-config
    attributes:
      label: MetaTube Server
      description: Paste the command line parameters or environment below. Please redact tokens and other sensitive information.
      render: shell

  - type: textarea
    id: media-server-logs
    attributes:
      label: Jellyfin/Emby Logs
      description: Paste the Jellyfin/Emby logs below.
      render: shell

  - type: textarea
    id: server-logs
    attributes:
      label: MetaTube Server Logs
      description: Paste the MetaTube server logs below.
      render: shell

  - type: textarea
    id: reproduce
    attributes:
      label: How to Reproduce
      description: Steps to reproduce the behavior, if any.
