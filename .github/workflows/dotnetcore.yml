name: .NET

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$INPUT_VERSION" ]; then
            version="$(date -u '+%Y.%-m%d.%-H%M.0')"
          else
            version="${INPUT_VERSION#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version: $INPUT_VERSION"
              exit 1
            fi
          fi
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Tag v$version already exists"
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::Failed to check tag v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build Plugins
        run: |
          dotnet build --configuration Release -p:Version=$VERSION
          dotnet build --configuration Release.Emby -p:Version=$VERSION

      - name: Generate Manifest
        run: |
          python3 -m pip install packaging
          python3 scripts/manifest.py Jellyfin.Plugin.MetaTube/bin/Jellyfin.MetaTube@v$VERSION.zip

      - name: Upload Plugins
        uses: softprops/action-gh-release@v3
        with:
          body: _Auto Released by Actions_
          tag_name: v${{ env.VERSION }}
          files: |
            Jellyfin.Plugin.MetaTube/bin/Jellyfin.MetaTube@v${{ env.VERSION }}.zip
            Jellyfin.Plugin.MetaTube/bin/Emby.MetaTube@v${{ env.VERSION }}.zip

      - name: Publish Manifest
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout --orphan dist
          git rm -rf .
          git add manifest.json
          git commit -m "Auto Updated by Actions"
          git push -f -u origin dist
