name: .NET

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (empty for auto)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [ -z "$version" ]; then
            version="$(date -u '+%Y.%-m%d.%-H%M.0')"
          elif ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $INPUT_VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Plugins
        run: |
          dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}
          dotnet build --configuration Release.Emby -p:Version=${{ steps.version.outputs.version }}

      - name: Generate Manifest
        run: |
          python3 -m pip install packaging
          python3 scripts/manifest.py Jellyfin.Plugin.MetaTube/bin/Jellyfin.MetaTube@v${{ steps.version.outputs.version }}.zip

      - name: Upload Plugins
        uses: softprops/action-gh-release@v3
        with:
          body: _Auto Released by Actions_
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            Jellyfin.Plugin.MetaTube/bin/Jellyfin.MetaTube@v${{ steps.version.outputs.version }}.zip
            Jellyfin.Plugin.MetaTube/bin/Emby.MetaTube@v${{ steps.version.outputs.version }}.zip

      - name: Publish Manifest
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout --orphan dist
          git rm -rf .
          git add manifest.json
          git commit -m "Auto Updated by Actions"
          git push -f -u origin dist
